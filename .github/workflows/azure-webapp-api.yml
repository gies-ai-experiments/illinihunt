name: Deploy API to Azure Web App

# Container-based deploy (current production method). GitHub builds the
# Express API image, pushes to Azure Container Registry; App Service
# `illinihunt` runs that image. An ACR webhook (illinihuntapicd) triggers the
# pull on :latest push.
#
# Restored as the API deploy path on 2026-08-23. This file had been overwritten
# by a code-based (Oryx/Node) variant that ships to the `staging` slot — now
# parked in azure-webapp-api-codebased.yml. Production is DOCKER and the slot is
# NODE|22-lts, so the two are not swap-compatible; for ~10 weeks every api/**
# push therefore deployed to a slot nothing swaps in, while production kept
# serving the image built on 2026-06-09.
#
# Rollback: the previous production image is
#   illinihuntdevacr.azurecr.io/illinihunt-api:2302fe309e5d14e193b943e2a08362f903f713ca
#   (digest sha256:f29a5f605486608a379453257061c1a11913fc2235f9161acdf42fe68d9c8d4f)
# Re-tag that as :latest and the ACR webhook redeploys it automatically.

on:
  push:
    # azure-migration only: `main` predates the migration and has no api/
    # directory, so building ./api from it would fail every time.
    branches: [azure-migration]
    paths:
      - 'api/**'
      - '.github/workflows/azure-webapp-api.yml'
  workflow_dispatch: {}

env:
  ACR_LOGIN_SERVER: illinihuntdevacr.azurecr.io
  IMAGE_NAME: illinihunt-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: illinihuntdevacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Note
        run: echo "Pushed :latest + :${{ github.sha }}. App Service auto-pulls via ACR webhook."
