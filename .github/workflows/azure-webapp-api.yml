name: Deploy API to Azure Web App

# Code-based (non-container) deploy of the Express API to Azure App Service
# `illinihunt`. Ships the api/ source; App Service's Oryx build runs
# `npm ci` + `npm run build` (prisma generate + tsc) on its Linux/Node 22
# runtime, then starts `node dist/index.js`. No container / ACR involved.
#
# (SCM_DO_BUILD_DURING_DEPLOYMENT=true + ENABLE_ORYX_BUILD=true are set as
# app settings on the web app, which is what triggers the server-side build.)

on:
  push:
    branches: [main, azure-migration]
    paths:
      - 'api/**'
      - '.github/workflows/azure-webapp-api.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deploy the api/ source as-is (fresh checkout has no node_modules, so
      # Oryx installs + builds on the Linux host — native deps + the Prisma
      # debian-openssl-3.0.x engine resolve correctly there).
      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: illinihunt
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./api
