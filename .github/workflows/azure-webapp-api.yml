name: Build and deploy IlliniHunt (frontend + API) to Azure Web App

# Single-web-app deploy (MindForum pattern): one Azure App Service serves BOTH
# the React SPA and the Express API. The runner builds the frontend (Vite) and
# the API (tsc + prisma), assembles a self-contained package, and ships it.
# Express serves /api/* and falls back to the SPA's index.html for everything
# else. No Static Web App, no container, no server-side Oryx build.

on:
  push:
    branches: [main, azure-migration]
    paths:
      - 'api/**'
      - 'src/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - '.github/workflows/azure-webapp-api.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      # ── Frontend (repo root) ────────────────────────────────────────────
      - name: Build frontend
        run: |
          npm ci
          npm run build
        env:
          # Same-origin now: the SPA and API share a host, so the API base is
          # a relative path. No CORS needed.
          VITE_API_URL: /api
          VITE_AZURE_TENANT_ID: ${{ vars.VITE_AZURE_TENANT_ID }}
          VITE_AZURE_CLIENT_ID: ${{ vars.VITE_AZURE_CLIENT_ID }}
          VITE_AZURE_API_CLIENT_ID: ${{ vars.VITE_AZURE_API_CLIENT_ID }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      # ── API (api/) ──────────────────────────────────────────────────────
      - name: Build API
        working-directory: ./api
        run: |
          npm ci
          npm run build
          # Prune dev deps FIRST — this wipes the generated node_modules/.prisma
          # client — then regenerate it into the pruned tree so the deployed
          # package actually contains the Prisma client (prisma CLI is a prod
          # dep now, so it survives the prune).
          npm prune --omit=dev
          npx prisma generate

      # ── Assemble one self-contained package ─────────────────────────────
      - name: Assemble deploy package
        run: |
          mkdir -p azure-package
          cp -R api/dist azure-package/dist
          cp -R api/node_modules azure-package/node_modules
          cp -R api/prisma azure-package/prisma
          cp api/package.json azure-package/package.json
          cp api/package-lock.json azure-package/package-lock.json
          # Frontend build → public/ (Express serves this as the SPA)
          cp -R dist azure-package/public

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: illinihunt-app
          path: azure-package

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: illinihunt-app
          path: azure-package

      - name: Deploy to Azure Web App (staging slot)
        uses: azure/webapps-deploy@v3
        with:
          app-name: illinihunt
          slot-name: staging
          package: azure-package
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
