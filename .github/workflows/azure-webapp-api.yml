name: Build and deploy Node.js API to Azure Web App - illinihunt

# Follows the MindForum pattern: build a fully self-contained package on the
# runner (dist + production node_modules + prisma), then deploy that prebuilt
# package via azure/webapps-deploy. App Service does NOT run an Oryx build
# (SCM_DO_BUILD_DURING_DEPLOYMENT=false) — OneDeploy just lays down files, which
# is what makes this reliable. App Service starts `node dist/index.js`.

on:
  push:
    branches: [main, azure-migration]
    paths:
      - 'api/**'
      - '.github/workflows/azure-webapp-api.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install + build (prisma generate + tsc)
        run: |
          npm ci
          npm run build

      - name: Prune to production dependencies (keeps generated Prisma client)
        run: npm prune --omit=dev

      - name: Assemble self-contained deploy package
        run: |
          mkdir -p azure-package
          cp -R dist azure-package/dist
          cp -R node_modules azure-package/node_modules
          cp -R prisma azure-package/prisma
          cp package.json azure-package/package.json
          cp package-lock.json azure-package/package-lock.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-app
          path: api/azure-package

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: api-app
          path: azure-package

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: illinihunt
          slot-name: Production
          package: azure-package
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
