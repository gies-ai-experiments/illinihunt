name: Deploy API to Azure Web App

# Container-based deploy (current production method). GitHub builds the
# Express API image, pushes to Azure Container Registry; App Service
# `illinihunt` runs that image. An ACR webhook (illinihuntapicd) triggers the
# pull on :latest push.
#
# NOTE: a code-based (Oryx/Node) deploy was attempted and works at runtime,
# but azure/webapps-deploy proved flaky (OneDeploy finalize failures). Staying
# on the container until a zero-downtime code path (deployment slot) is set up.

on:
  push:
    branches: [main, azure-migration]
    paths:
      - 'api/**'
      - '.github/workflows/azure-webapp-api.yml'
  workflow_dispatch: {}

env:
  ACR_LOGIN_SERVER: illinihuntdevacr.azurecr.io
  IMAGE_NAME: illinihunt-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: illinihuntdevacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Note
        run: echo "Pushed :latest + :${{ github.sha }}. App Service auto-pulls via ACR webhook."
